<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Memory Garden — A Digital Keepsake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #fbf7f0;
      --paper: #fffdf9;
      --ink: #3a2e2c;
      --muted: #7a6864;
      --accent-rose: #b85d6f;
      --accent-gold: #c59b5f;
      --accent-sage: #6c8270;
      --border-soft: #e6dacb;
      --shadow-soft: 0 14px 35px rgba(58, 46, 44, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-cream);
      background-image: radial-gradient(#e7dccb 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px 16px 135px; /* Ruang ekstra di bawah agar tidak tertutup music player di HP */
    }

    #fx-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }

    /* FLOATING MUSIC PLAYER */
    .music-player {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 100;
      background: rgba(255, 253, 249, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      padding: 10px 14px;
      box-shadow: 0 10px 28px rgba(58, 46, 44, 0.14);
      width: 280px;
      transition: all 0.3s ease;
    }

    .music-player.minimized {
      width: 195px;
    }

    .music-player.minimized .music-info {
      display: none;
    }

    .music-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .music-badge {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--accent-rose);
      font-weight: 600;
    }

    .minimize-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      padding: 2px 6px;
    }

    .music-body {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .album-cover {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border-soft);
      animation: spinSlow 14s linear infinite;
      animation-play-state: paused;
    }

    .music-player.playing .album-cover {
      animation-play-state: running;
    }

    @keyframes spinSlow {
      100% { transform: rotate(360deg); }
    }

    .music-info {
      flex: 1;
      overflow: hidden;
    }

    .song-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
    }

    .volume-control input[type="range"] {
      width: 100%;
      accent-color: var(--accent-rose);
      height: 4px;
      cursor: pointer;
    }

    .play-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--accent-rose);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .play-btn:active {
      transform: scale(0.92);
    }

    /* CHAPTER PROGRESS DOTS */
    .chapter-dots {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 40;
      background: rgba(255, 253, 249, 0.9);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dfd3c3;
      transition: all 0.3s ease;
    }

    .dot.active {
      background: var(--accent-rose);
      transform: scale(1.3);
    }

    /* MAIN CONTAINER & CHAPTER TRANSITIONS */
    .book-container {
      width: 100%;
      max-width: 760px;
      margin-top: 48px;
    }

    .chapter {
      display: none;
      background: var(--paper);
      border: 1px solid var(--border-soft);
      border-radius: 24px;
      padding: 38px 26px;
      box-shadow: var(--shadow-soft);
      text-align: center;
      animation: fadeUp 0.6s ease forwards;
    }

    .chapter.active {
      display: block;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chapter-tag {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      letter-spacing: 2px;
      color: var(--accent-gold);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .chapter-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .chapter-desc {
      color: var(--muted);
      font-size: 0.92rem;
      max-width: 500px;
      margin: 0 auto 24px;
      line-height: 1.6;
    }

    /* CHAPTER 01: INVITATION */
    .envelope-wrapper {
      background: linear-gradient(145deg, #fdf8f0, #f5eadb);
      border: 1.5px dashed var(--accent-gold);
      border-radius: 20px;
      padding: 36px 20px;
      position: relative;
      margin-top: 10px;
    }

    .wax-seal {
      width: 56px;
      height: 56px;
      background: var(--accent-rose);
      color: #fff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      margin: 0 auto 16px;
      box-shadow: 0 6px 16px rgba(184, 93, 111, 0.35);
    }

    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.15rem;
      color: var(--muted);
    }

    .recipient-name {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      margin: 10px 0 14px;
      color: var(--ink);
    }

    .hint-text {
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    /* BUTTONS */
    .btn-primary, .btn-secondary, .btn-envelope {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 13px 24px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-primary {
      background: var(--accent-rose);
      color: #fff;
      box-shadow: 0 6px 18px rgba(184, 93, 111, 0.28);
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-soft);
      color: var(--muted);
    }

    .btn-secondary:active {
      background: #f5ede2;
      color: var(--ink);
    }

    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    /* CHAPTER 02: MEMORY GARDEN (2x2 di HP) */
    .garden-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (min-width: 640px) {
      .garden-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .flower-card {
      background: #fdf9f3;
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 16px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: all 0.25s ease;
    }

    .flower-card.opened {
      border-color: var(--accent-sage);
      background: #f3f7f2;
      transform: translateY(-2px);
    }

    .flower-icon {
      font-size: 2rem;
    }

    .flower-label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--ink);
    }

    .flower-status {
      font-size: 0.72rem;
      color: var(--accent-sage);
    }

    .flower-message-box {
      background: #f7f1e7;
      border-left: 4px solid var(--accent-sage);
      padding: 16px 18px;
      border-radius: 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-style: italic;
      color: var(--ink);
      min-height: 76px;
      display: grid;
      place-items: center;
    }

    /* CHAPTER 03: SCRAPBOOK POLAROIDS (5 FOTO) */
    .scrapbook-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    .polaroid {
      background: #fff;
      width: 210px;
      padding: 12px 12px 18px;
      border: 1px solid #eadfd2;
      box-shadow: 0 10px 24px rgba(0,0,0,0.07);
      transform: rotate(var(--rot, 0deg));
      transition: transform 0.3s ease;
      position: relative;
    }

    .polaroid:hover, .polaroid:active {
      transform: rotate(0deg) scale(1.03);
      z-index: 5;
    }

    .tape {
      width: 68px;
      height: 18px;
      background: rgba(226, 206, 177, 0.55);
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
    }

    .polaroid img {
      width: 100%;
      height: 185px;
      object-fit: cover;
      margin-bottom: 10px;
      border-radius: 2px;
    }

    .polaroid .caption {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.35;
    }

    /* CHAPTER 04: LETTER */
    .btn-envelope {
      background: #f3e6d5;
      color: var(--ink);
      border: 1px solid var(--accent-gold);
      margin-bottom: 18px;
    }

    .letter-paper {
      display: none;
      text-align: left;
      background: #fffcf7;
      border: 1px solid #e6d8c5;
      padding: 24px 20px;
      border-radius: 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.18rem;
      line-height: 1.75;
      box-shadow: inset 0 0 30px rgba(235, 222, 202, 0.35);
      animation: unfold 0.8s ease forwards;
    }

    .letter-paper.open {
      display: block;
    }

    @keyframes unfold {
      from { opacity: 0; transform: scaleY(0.85); }
      to { opacity: 1; transform: scaleY(1); }
    }

    .letter-paper p {
      margin-bottom: 14px;
    }

    .letter-date {
      text-align: right;
      font-style: italic;
      color: var(--muted);
    }

    .letter-sign {
      margin-top: 20px;
    }

    /* CHAPTER 05: BIRTHDAY CAKE & WISH */
    .cake-stage {
      margin: 20px 0;
    }

    .cake {
      position: relative;
      width: 160px;
      height: 130px;
      margin: 28px auto 22px;
    }

    .candle {
      width: 12px;
      height: 36px;
      background: repeating-linear-gradient(45deg, #fff, #fff 5px, var(--accent-rose) 5px, var(--accent-rose) 10px);
      margin: 0 auto;
      border-radius: 4px;
      position: relative;
    }

    .flame {
      width: 14px;
      height: 20px;
      background: radial-gradient(circle, #fff6a9 10%, #ff9d00 60%, #ff4d00 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      position: absolute;
      top: -22px;
      left: -1px;
      animation: flicker 0.6s infinite alternate;
      box-shadow: 0 0 14px #ffae00;
    }

    .flame.out {
      display: none;
    }

    @keyframes flicker {
      from { transform: scale(1) rotate(-2deg); }
      to { transform: scale(1.1) rotate(2deg); }
    }

    .frosting {
      width: 140px;
      height: 22px;
      background: #fff;
      border-radius: 12px 12px 6px 6px;
      margin: 0 auto;
      border: 1px solid #eadfd2;
    }

    .cake-body {
      width: 140px;
      height: 58px;
      background: #e5989b;
      margin: 0 auto;
      border-radius: 0 0 10px 10px;
    }

    .plate {
      width: 170px;
      height: 10px;
      background: #dfd3c3;
      border-radius: 999px;
      margin: 0 auto;
    }

    .final-gift-card {
      display: none;
      background: #fdf6ec;
      border: 1.5px solid var(--accent-gold);
      border-radius: 18px;
      padding: 22px 18px;
      margin-top: 22px;
      animation: fadeUp 0.6s ease forwards;
    }

    .final-gift-card.show {
      display: block;
    }

    .final-gift-card h3 {
      font-family: 'Cinzel', serif;
      margin-bottom: 10px;
      color: var(--accent-rose);
    }

    .final-gift-card p {
      font-size: 0.94rem;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    /* KHUSUS LAYAR HP
